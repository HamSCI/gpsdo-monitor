# Sigmond deploy manifest for gpsdo-monitor.
#
# gpsdo-monitor is an `infra` client (like igmp-querier) — it does not
# conform to the full client contract (no validate, no per-instance
# inventory), but sigmond can still install, start, stop, and monitor
# its one systemd unit.  It DOES implement a minimal `inventory --json`
# reporting only the CONTRACT §3 hardware_present field (Phase D), so
# sigmond can mark it core-but-dormant when no GPSDO is attached.

[package]
name             = "gpsdo-monitor"
version          = "0.2.0"
description      = "Leo Bodnar GPSDO health monitor + mDNS advertiser"
license          = "MIT"
kind             = "infra"

# ---------------------------------------------------------------------------
# Systemd units sigmond's lifecycle layer manages on this client's behalf.
# Lifecycle resolver reads [systemd].units (concrete) and
# [systemd].templated_units (one-per-configured-instance).
# ---------------------------------------------------------------------------

[systemd]
units = [
    "gpsdo-monitor.service",
]

# The config this client needs, declared the contract way (kind = "render").
# install.sh's install_config() copies the same file when /etc/gpsdo-monitor/
# config.toml is absent; this entry names it so sigmond can judge `configured`
# and ops' site-capture can record how a site's copy differs from the default.
[[install.steps]]
kind      = "render"
src       = "deploy/config.example.toml"
dst       = "/etc/gpsdo-monitor/config.toml"
mode      = "0644"
if_absent = true
